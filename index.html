<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101a33">
  <meta name="description" content="تعلم الفرنسية من A1 إلى C2 دون إنترنت">
  <title>Français — تعلم الفرنسية</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="الرئيسية"><span class="brand-mark">F</span><span>Français<span class="brand-dot">.</span></span></a>
    <div class="top-stats"><span>⭐ <b id="points">0</b></span><span>🔥 <b id="streak">0</b></span></div>
  </header>

  <main id="app">
    <section class="hero">
      <div class="hero-copy">
        <p class="eyebrow">رحلتك مع اللغة الفرنسية</p>
        <h1>Bonjour,<br><span>مستقبلك يبدأ بكلمة.</span></h1>
        <p class="hero-sub">تعلّم الفرنسية خطوة بخطوة، في أي وقت، حتى دون اتصال بالإنترنت.</p>
        <button class="primary-btn" id="continueBtn">تابع التعلّم <span>←</span></button>
      </div>
      <div class="hero-art" aria-hidden="true"><div class="orbit orbit-one"></div><div class="orbit orbit-two"></div><div class="french-card"><strong>🇫🇷</strong><span>Bonjour !</span><small>مرحباً بك</small></div><span class="spark spark-a">✦</span><span class="spark spark-b">✧</span></div>
    </section>

    <section class="section-head"><div><p class="eyebrow">مسار التعلّم</p><h2>اختر مستواك</h2></div><span class="offline-pill"><i></i> يعمل دون إنترنت</span></section>
    <nav class="levels" id="levels" aria-label="المستويات"></nav>
    <section class="lesson-section">
      <div class="section-head compact"><div><p class="eyebrow" id="levelCaption">المستوى المبتدئ</p><h2 id="lessonHeading">دروس A1</h2></div><span class="muted" id="lessonCount"></span></div>
      <div class="lesson-list" id="lessonList"></div>
    </section>

    <section class="game-promo">
      <div><p class="eyebrow">تعلّم باللعب</p><h2>اختبر ذاكرتك!</h2><p>تحدّ قصير لتثبيت الكلمات الجديدة.</p><button class="light-btn" id="playGame">ابدأ اللعبة <span>←</span></button></div>
      <div class="game-icon">🧩</div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="التنقل">
    <button class="nav-item active" data-tab="home"><span>⌂</span>الرئيسية</button>
    <button class="nav-item" data-tab="words"><span>▤</span>المفردات</button>
    <button class="nav-item" data-tab="game"><span>✧</span>الألعاب</button>
    <button class="nav-item" data-tab="progress"><span>◷</span>تقدمي</button>
  </nav>

  <dialog id="lessonDialog" class="sheet">
    <form method="dialog"><button class="close-btn" aria-label="إغلاق">×</button></form>
    <div id="lessonContent"></div>
  </dialog>
  <dialog id="gameDialog" class="sheet">
    <form method="dialog"><button class="close-btn" aria-label="إغلاق">×</button></form>
    <div id="gameContent"></div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
